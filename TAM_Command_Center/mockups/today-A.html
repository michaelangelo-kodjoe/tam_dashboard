<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAM CC Today A Focus Deck</title><style>/* Design tokens (docs/02_DESIGN_GUIDELINES.md §1). The ONLY file that contains raw colour values. */
:root {
  color-scheme: dark;

  /* surfaces */
  --bg: #0b0d10;
  --surface-1: #11151b;
  --surface-2: #171c24;
  --surface-3: #1f2630;
  --border: #2b3441;
  --border-strong: #3d4a5c;
  --border-control: #647186;

  /* text */
  --text: #e6e9ee;
  --muted: #9aa3b0;
  --subtle: #6b7482;

  /* accent */
  --accent: #fa9a28;
  --accent-hover: #ffb052;
  --accent-press: #db8318;
  --on-accent: #0b0d10;
  --accent-tint: rgba(250, 154, 40, 0.12);

  /* status */
  --info: #5aaeff;
  --success: #3fc77f;
  --warning: #e8c547;
  --danger: #ff5c5c;
  --neutral: #9aa3b0;
  --info-tint: rgba(90, 174, 255, 0.12);
  --success-tint: rgba(63, 199, 127, 0.12);
  --warning-tint: rgba(232, 197, 71, 0.12);
  --danger-tint: rgba(255, 92, 92, 0.12);
  --neutral-tint: rgba(154, 163, 176, 0.12);

  --focus: #7cc4ff;
  --scrim: rgba(0, 0, 0, 0.6);
  --hover-row: rgba(255, 255, 255, 0.03);

  /* type */
  --font-sans: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'Cascadia Mono', Consolas, 'SF Mono', monospace;
  --fs-label: 11px;
  --fs-sm: 12px;
  --fs-base: 13px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 20px;
  --lh-label: 16px;
  --lh-sm: 16px;
  --lh-base: 20px;
  --lh-md: 20px;
  --lh-lg: 24px;
  --lh-xl: 28px;

  /* spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* radius / elevation / motion */
  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 6px;
  --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.5);
  --dur: 120ms;
  --ease: ease-out;

  /* layout */
  --topbar-h: 48px;
  --rail-w: 208px;
  --gutter: 24px;
  --ctrl-h: 32px;
  --ctrl-h-sm: 28px;
  --row-h: 32px;
  --row-h-comfy: 40px;
  --drawer-w: 480px;
  --context-w: 320px;
  --today-side-w: 360px;
}

@media (max-width: 1279px) {
  :root { --rail-w: 56px; }
}
@media (max-width: 1023px) {
  :root { --gutter: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --dur: 0ms; }
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 var(--fs-base)/var(--lh-base) var(--font-sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{appearance:none;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:14px;height:14px}svg.i.l{width:18px;height:18px}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}.subtle{color:var(--subtle)}.acc{color:var(--accent)}.dng{color:var(--danger)}.wrn{color:var(--warning)}.inf{color:var(--info)}.ok{color:var(--success)}
.label{font-size:var(--fs-label);line-height:var(--lh-label);text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.sm{font-size:var(--fs-sm);line-height:var(--lh-sm)}
/* shell */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;min-height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);background:var(--surface-1);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.brand{width:calc(var(--rail-w) - var(--sp-4));font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:8px;font-size:var(--fs-md)}
.brand b{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:1px}
.jump{display:flex;align-items:center;gap:8px;height:var(--ctrl-h);width:min(420px,40vw);padding:0 10px;background:var(--surface-3);border:1px solid var(--border-control);border-radius:var(--r-md);color:var(--muted)}
.jump kbd{margin-left:auto;font:var(--fs-label) var(--font-mono);color:var(--subtle);border:1px solid var(--border-strong);border-radius:2px;padding:0 4px}
.sp{flex:1}
.envb{font-size:var(--fs-label);font-weight:600;letter-spacing:.06em;color:var(--warning);background:var(--warning-tint);padding:1px 6px;border-radius:var(--r-sm)}
.clock{color:var(--muted)}
.rail{background:var(--bg);border-right:1px solid var(--border);padding:var(--sp-3) var(--sp-2);display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h))}
.ni{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-md);color:var(--muted);position:relative}
.ni:hover{background:var(--surface-2);color:var(--text)}
.ni.on{background:var(--accent-tint);color:var(--accent)}
.ni.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:2px;background:var(--accent)}
.ni .later{margin-left:auto;font-size:var(--fs-label);color:var(--subtle);border:1px solid var(--border);padding:0 4px;border-radius:2px}
.ni.bt{margin-top:auto}
.main{padding:var(--sp-5) var(--gutter) var(--sp-8);min-width:0}
@media(max-width:1279px){.brand{width:auto}.rail{padding:var(--sp-3) 6px}.ni span,.ni .later{display:none}.ni{justify-content:center;padding:0}.ni.on::before{left:-6px}}
@media(max-width:767px){.jump{display:none}.clock{display:none}}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--ctrl-h);padding:0 12px;border-radius:var(--r-md);font-weight:500;white-space:nowrap;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn.sm{height:var(--ctrl-h-sm);font-size:var(--fs-sm)}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:600}.btn.pri:hover{background:var(--accent-hover)}
.btn.sec{background:var(--surface-3);border:1px solid var(--border-control)}.btn.sec:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.gh{color:var(--muted)}.btn.gh:hover{background:var(--surface-3);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:var(--r-sm);font-size:var(--fs-sm);white-space:nowrap}
.b-dng{background:var(--danger-tint);color:var(--danger)}.b-wrn{background:var(--warning-tint);color:var(--warning)}.b-inf{background:var(--info-tint);color:var(--info)}.b-ok{background:var(--success-tint);color:var(--success)}.b-neu{background:var(--neutral-tint);color:var(--neutral)}.b-acc{background:var(--accent-tint);color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none}
.dot.dng{background:var(--danger)}.dot.wrn{background:var(--warning)}.dot.ok{background:var(--success)}.dot.inf{background:var(--info)}.dot.acc{background:var(--accent)}
.panel{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.ph .more{margin-left:auto;font-size:var(--fs-sm);color:var(--muted);display:inline-flex;align-items:center;gap:2px}.ph .more:hover{color:var(--text)}
.pb{padding:12px 14px}
.stack{display:flex;height:6px;border-radius:1px;overflow:hidden;background:var(--surface-3);gap:1px}
.stack i{display:block;height:100%}
.c-dng{background:var(--danger)}.c-wrn{background:var(--warning)}.c-ok{background:var(--success)}.c-inf{background:var(--info)}.c-acc{background:var(--accent)}.c-neu{background:var(--border-strong)}
.ptr{font-size:var(--fs-sm);white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease);z-index:40}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer-w),100vw);background:var(--surface-2);border-left:1px solid var(--border-strong);box-shadow:var(--shadow-pop);transform:translateX(24px);opacity:0;pointer-events:none;transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:none;opacity:1;pointer-events:auto}
.drawer header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:var(--fs-lg);font-weight:600;gap:8px}
.dtabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border)}

.dtabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.dbody{padding:8px 16px 24px;overflow:auto}
.dg{margin:14px 0 4px}
.drow{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.dt{display:flex;flex-direction:column}.dt small{font-size:var(--fs-sm)}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1240px;margin:0 auto;align-items:start}
.hd{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.hd h1{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:600}
.hd .date{color:var(--muted)}
.strip{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;height:var(--ctrl-h);padding:0 12px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);transition:background var(--dur),border-color var(--dur)}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed=true] b{color:var(--accent)}
.chip .dot{width:6px;height:6px}
.hero{position:relative;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:20px 22px 18px 26px;margin-bottom:12px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hc,var(--danger))}
.hero .k{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hero h2{font-size:var(--fs-xl);line-height:var(--lh-xl);font-weight:600;margin-bottom:2px}
.hero .ac{color:var(--muted);font-size:var(--fs-md)}
.hero .why{margin:14px 0;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);display:flex;gap:8px}
.hero .why svg{color:var(--hc,var(--danger));margin-top:2px}
.hero .facts{display:flex;gap:28px;margin-bottom:16px;flex-wrap:wrap}
.hero .facts div span{display:block}
.hero .acts{display:flex;gap:8px;align-items:center}
.lst{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:26px 4px minmax(0,1fr) auto 18px;gap:12px;align-items:center;min-height:52px;padding:6px 12px 6px 10px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);transition:background var(--dur),border-color var(--dur);cursor:pointer}
.row:hover{background:var(--surface-2);border-color:var(--border-strong)}
.row .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-control);display:grid;place-items:center;font-size:var(--fs-sm);color:var(--muted);font-variant-numeric:tabular-nums}
.row .bar{align-self:stretch;margin:4px 0;border-radius:1px;background:var(--rc)}
.row .t{min-width:0}.row .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t div:last-child{color:var(--muted);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.row .r small{color:var(--muted);font-size:var(--fs-sm)}
.row .ck{width:18px;height:18px;border:1px solid var(--border-control);border-radius:2px;background:var(--surface-3);display:grid;place-items:center;color:var(--on-accent)}
.row.done{opacity:.55}.row.done .t div:first-child{text-decoration:line-through}.row.done .ck{background:var(--success);border-color:var(--success)}
.row .chev{color:var(--subtle)}
.more{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted)}
.more a{color:var(--info)}.more a:hover{text-decoration:underline}
details.rest{margin-top:6px}details.rest summary{list-style:none;cursor:pointer;color:var(--muted);padding:8px 4px;display:flex;align-items:center;gap:6px}details.rest summary::-webkit-details-marker{display:none}details.rest[open] summary svg{transform:rotate(180deg)}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:68px}
.ring{display:flex;align-items:center;gap:16px;padding:16px}
.ring svg{width:84px;height:84px;flex:none}
.ring .big{font-size:var(--fs-xl);font-weight:600;line-height:1}
.launch{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-top:1px solid var(--border);color:var(--muted);text-align:left}
.launch:first-of-type{border-top:0}.launch:hover{background:var(--surface-2);color:var(--text)}
.launch .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text)}
@media(max-width:1199px){.wrap{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap}.side>.panel{flex:1 1 280px}}
